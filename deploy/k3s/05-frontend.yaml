apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: syphax
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: syphax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: syphax-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # It serves a static bundle and proxies /api and /ws to the backend
          # Service. Nothing is written, nothing is secret.
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
