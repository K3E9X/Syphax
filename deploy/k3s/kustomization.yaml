apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syphax

# secret.yaml is NOT listed: it is generated by make-secret.sh and gitignored.
# Apply it separately, before this.
resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-postgres.yaml
  - 03-redis.yaml
  - 04-syphax.yaml
  - 05-frontend.yaml
  - 06-sandbox-runner.yaml
  - 07-networkpolicy.yaml
  - 08-ingress.yaml

images:
  - name: syphax-backend
    newTag: latest
  - name: syphax-proxy
    newTag: latest
  - name: syphax-frontend
    newTag: latest
  - name: syphax-sandbox-runner
    newTag: latest
