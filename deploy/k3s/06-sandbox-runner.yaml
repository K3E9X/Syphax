# Runs untrusted third-party PoCs.
#
# READ THIS BEFORE CHANGING IT. In docker-compose the isolation is structural:
# the runner is attached to a network that Postgres, Redis and the backend's
# secrets are not on, so there is no route to them and nothing to firewall.
# Kubernetes has no equivalent - every pod gets a network and can address every
# Service - so here the same property is produced by the NetworkPolicy in
# 07-networkpolicy.yaml.
#
# That is a real change in kind: "unaddressable" became "filtered". If this
# cluster runs with --disable-network-policy, or with a CNI that does not
# enforce them, the policy is silently inert and this pod can reach the
# database. k3s enforces NetworkPolicies by default (kube-router); nothing here
# checks that it still does.
#
# What is deliberately absent, and each absence is the point:
#   envFrom secret  - no provider keys, no database password.
#   the data volume - no mitmproxy CA, no at-rest settings key.
#   cluster DNS     - dnsPolicy: None below. It has no business resolving a
#                     Service name, and resolving one is the first step of
#                     reaching it.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-runner
  namespace: syphax
spec:
  selector:
    app: sandbox-runner
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runner
  namespace: syphax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-runner
  template:
    metadata:
      labels:
        app: sandbox-runner
    spec:
      # Public resolvers, not the cluster's: a PoC must not be able to look up
      # in-cluster service names. entrypoint.sh reads these from resolv.conf and
      # allows DNS to exactly these addresses, because the runner resolves the
      # engagement scope on every request - a wildcard scope has no address to
      # pin at boot, so per-request resolution is the only thing that works.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "1.1.1.1"
          - "9.9.9.9"
      # It never talks to the API server, so do not hand it a token.
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: syphax-sandbox-runner:latest
          imagePullPolicy: IfNotPresent
          env:
            # OPTIONAL permanent pin, applied on top of the per-request
            # allowlist and never flushed. Leave it empty: the engagement scope
            # arrives with each /v1/run call and is written into the
            # SYPHAX_EGRESS chain for the duration of that run.
            #
            # This used to be the only allowlist, and since nothing ever set it,
            # the runner denied every outbound packet while /health answered
            # "ok" - so every PoC failed against the firewall and the operator
            # was told the exploit had not worked.
            - name: SANDBOX_ALLOWED_HOSTS
              value: ""
            - name: SANDBOX_MAX_TIMEOUT
              value: "120"
            # Shared with the backend: the runner keeps CAP_NET_ADMIN so it can
            # set the allowlist, so only the backend may drive it.
            - name: SANDBOX_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: syphax-secrets
                  key: SANDBOX_RUNNER_TOKEN
                  optional: true
          ports:
            - containerPort: 8090
          securityContext:
            # NET_ADMIN lets the runner write the egress allowlist for each
            # request; SETUID/SETGID let it `gosu poc` the PoC itself. The
            # server holds them, the untrusted code never does, and an iptables
            # owner-match rule stops the PoC reaching the control port to ask
            # for a wider allowlist.
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "SETUID", "SETGID"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            # Staged code never touches a disk that survives the pod.
            - name: work
              mountPath: /work
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
