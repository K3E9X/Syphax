# Copy to secret.yaml, fill it in, and apply it. secret.yaml is gitignored.
#   ./make-secret.sh > secret.yaml
#
# stringData rather than data: kubectl base64-encodes it for you, and a
# hand-encoded secret is a secret somebody eventually gets wrong.
apiVersion: v1
kind: Secret
metadata:
  name: syphax-secrets
  namespace: syphax
type: Opaque
stringData:
  POSTGRES_DB: syphax
  POSTGRES_USER: syphax
  # Generate. Never ship the example value: this database holds every captured
  # session the proxy recorded.
  POSTGRES_PASSWORD: "CHANGE-ME"

  # Encrypts the provider API keys at rest. If this is empty the backend mints
  # one into the data volume on first start, which works until that volume is
  # replaced - and then every stored key silently stops decrypting.
  SYPHAX_SECRET_KEY: "CHANGE-ME"

  # Optional machine credential for scripts and CI. Empty means a browser
  # session is the only way in, which is the right default.
  SYPHAX_API_KEY: ""

  # Optional: seed the first operator account without opening a browser. Read
  # ONLY when no account exists, so they cannot reset an existing password.
  # Remove these two lines once the account is created.
  SYPHAX_ADMIN_USER: ""
  SYPHAX_ADMIN_PASSWORD: ""

  # Optional tool tokens.
  WPSCAN_API_TOKEN: ""
  GITHUB_TOKEN: ""
