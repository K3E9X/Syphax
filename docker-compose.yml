# docker-compose for Syphax v2 (AutoPentester foundation).
#
# Services:
#   * postgres   - primary store (engagements, jobs, findings, proxy flows)
#   * redis      - arq worker queue + transient state
#   * backend    - FastAPI API (image target: app)
#   * proxy      - mitmproxy addon (image target: proxy - its own dependency set)
#   * worker     - arq scan worker        (shares backend's netns for the tunnel)
#   * orchestrator - arq autonomous loops (shares backend's netns for the tunnel)
#   * frontend   - React build served by nginx
#
# All persistent state lives in volumes; nothing important is in container fs.

services:
  postgres:
    networks: [syphax-net]
    image: postgres:16-alpine
    container_name: syphax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syphax}
      POSTGRES_USER: ${POSTGRES_USER:-syphax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syphax}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syphax} -d ${POSTGRES_DB:-syphax}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not exposed to the host by default; backend reaches it on the internal
    # network. Uncomment to inspect with psql from the host.
    # ports:
    #   - "5432:5432"

  redis:
    networks: [syphax-net]
    image: redis:7-alpine
    container_name: syphax-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    networks: [syphax-net, sandbox-net]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: syphax-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - MITM_PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-syphax}:${POSTGRES_PASSWORD:-syphax}@postgres:5432/${POSTGRES_DB:-syphax}
      - REDIS_URL=redis://redis:6379/0
    ports:
      # Loopback by default. BIND_ADDRESS=0.0.0.0 publishes them on every
      # interface, which is what a VM install needs - and what you should not
      # do until there is TLS in front of it.
      #
      # The API now requires an operator account, so an exposed 8000 is a login
      # page rather than an open door.
      #
      # 8080 has its OWN variable, and it is not BIND_ADDRESS. That port is a
      # live HTTPS-intercepting proxy: it has no authentication of its own, and
      # mitmproxy will relay for anyone who can reach it. Publishing it because
      # you wanted the UI reachable would hand the network an open proxy with a
      # trusted CA behind it. Two variables, so that cannot happen by accident.
      #
      # 8080 is published here rather than on the proxy service because that
      # service shares this container's network namespace (for the tunnel).
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      # Bind mount: mitmproxy CA cert lives here, users download it from /api/proxy/ca.pem.
      - ./data:/data
    cap_add:
      - NET_ADMIN
    # WireGuard and OpenVPN both need a TUN device to create the tunnel
    # interface. Without it wg-quick fails with "Cannot find device", which
    # reads like a missing binary rather than a missing device.
    #
    # Present on Docker Desktop's Linux VM (macOS, Windows) and on Linux hosts.
    # If your host genuinely lacks it, comment this out and bring the tunnel up
    # host-side instead: the kill switch compares exit IPs and protects you
    # either way, whoever owns the tunnel.
    devices:
      - /dev/net/tun:/dev/net/tun

  # mitmproxy, in its own image. It pins cryptography<44.1, and while it shared
  # an environment with the API that pin held the whole stack seven majors back.
  # Shares the backend's network namespace so captured traffic goes through the
  # tunnel too, and so 8080 stays published in one place.
  proxy:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: proxy
    container_name: syphax-proxy
    restart: unless-stopped
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - MITM_PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-syphax}:${POSTGRES_PASSWORD:-syphax}@postgres:5432/${POSTGRES_DB:-syphax}
    volumes:
      # The mitmproxy CA lives here; users download it from /api/proxy/ca.pem.
      - ./data:/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: syphax-worker
    restart: unless-stopped
    # Share the backend's network namespace. The backend is the only container
    # with NET_ADMIN + /dev/net/tun, so it is the only one wg-quick can route.
    # Without this the tools spawned here egress directly and the "VPN connected"
    # badge is a lie: verify_exit_ip() measures the backend, not the scanners.
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://${POSTGRES_USER:-syphax}:${POSTGRES_PASSWORD:-syphax}@postgres:5432/${POSTGRES_DB:-syphax}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Same /data as the backend so the worker can read mitmproxy's CA dir
      # if a wrapper ever needs to (none today, but keeps things flexible).
      - ./data:/data
    # Same image, different entrypoint: arq picks scan jobs off Redis and
    # runs nuclei/sqlmap/ffuf/dalfox/nmap/etc.
    entrypoint: []
    command: ["arq", "app.workers.WorkerSettings"]

  # Dedicated worker for the autonomous orchestrator loops, on its own queue so
  # a long-lived run never starves the scan worker's pool (avoids deadlock).
  orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: syphax-orchestrator
    restart: unless-stopped
    # Share the backend's network namespace. The backend is the only container
    # with NET_ADMIN + /dev/net/tun, so it is the only one wg-quick can route.
    # Without this the tools spawned here egress directly and the "VPN connected"
    # badge is a lie: verify_exit_ip() measures the backend, not the scanners.
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://${POSTGRES_USER:-syphax}:${POSTGRES_PASSWORD:-syphax}@postgres:5432/${POSTGRES_DB:-syphax}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/data
    entrypoint: []
    command: ["arq", "app.workers.OrchestratorWorkerSettings"]

  frontend:
    networks: [syphax-net]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syphax-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:80"

  # Runs untrusted third-party PoCs. Attached to sandbox-net ONLY: Postgres,
  # Redis and the backend's secrets live on syphax-net, which this container is
  # not on. There is no route to them, so there is nothing to firewall.
  #
  # Deliberately absent, and each absence is the point:
  #   env_file      - no API keys, no DB password. Nothing worth stealing.
  #   ./data mount  - no access to the mitmproxy CA or the settings key.
  #   syphax-net    - cannot address the database or the queue.
  sandbox-runner:
    build:
      context: ./sandbox-runner
      dockerfile: Dockerfile
    container_name: syphax-sandbox-runner
    restart: unless-stopped
    networks: [sandbox-net]
    environment:
      # Comma-separated engagement scope. EMPTY MEANS DENY ALL OUTBOUND - a
      # sandbox that silently allows the whole internet is worse than one that
      # fails visibly. Set per engagement before running a PoC.
      - SANDBOX_ALLOWED_HOSTS=${SANDBOX_ALLOWED_HOSTS:-}
      - SANDBOX_MAX_TIMEOUT=${SANDBOX_MAX_TIMEOUT:-120}
    # NET_ADMIN is needed to pin the egress rules at boot; entrypoint.sh drops
    # to an unprivileged user immediately afterwards, so the PoC never holds it.
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /work:size=64m,mode=1777
      - /run:size=1m
      - /tmp:size=16m
    mem_limit: 512m
    pids_limit: 128
    # Not published to the host: only the backend, on sandbox-net, can reach it.
    expose:
      - "8090"

networks:
  # Everything that holds state or secrets.
  syphax-net:
  # Backend <-> sandbox-runner only. The runner never initiates anything
  # towards the backend, so a compromised runner has nothing to call.
  sandbox-net:

volumes:
  postgres-data:
  redis-data:
