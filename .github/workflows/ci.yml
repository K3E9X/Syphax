name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Run the JS-based actions (checkout/setup-python/setup-node) on Node 24 so the
# Node 20 deprecation warning goes away. Official opt-in per GitHub's changelog.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      # Resolve the FULL production stack (no install) so an incompatible pin
      # fails CI here - without paying to build/install the heavy web/proxy deps.
      - name: Resolve production requirements
        run: pip install --dry-run -r requirements.txt
      # The unit tests are pure logic; install only what they need to run.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Byte-compile
        run: python -m compileall -q app
      - name: Unit tests
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build

  compose:
    name: Compose + Dockerfile (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The stack ships only as docker compose, so a broken compose file or
      # Dockerfile used to surface at deploy time. Validating costs seconds;
      # the full image build (all the scanner binaries) runs in nightly.yml.
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose OK"
      - name: Lint the Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
