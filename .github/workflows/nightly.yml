name: Nightly

# The push CI proves the code is consistent with itself. This one catches the
# failures that arrive without anyone touching the repo:
#   * a transitive dependency publishes a breaking release
#   * a pinned version is yanked from PyPI / npm
#   * the container image stops building
#   * a wrapped tool disappears from its upstream install source
#
# Runs on a schedule, and on demand from the Actions tab.
#
# main ONLY. A scheduled workflow already runs nowhere else - GitHub restricts
# `schedule` to the default branch - but the Run workflow dropdown will happily
# dispatch this against any branch, and a run against a stale one builds stale
# code while the run is labelled with that branch. That is worse than not
# running: it answers "does the shipping image build?" with someone else's
# code. The `guard` job below stops that, loudly.
on:
  schedule:
    # 05:17 UTC daily. Off the hour on purpose: GitHub queues scheduled jobs
    # and the top of the hour is heavily contended, which delays runs.
    - cron: "17 5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Fails fast and explicitly on any branch but main, so a mis-selected branch
  # costs five seconds and says why - instead of twenty minutes of QEMU and a
  # result about the wrong commit. It must FAIL rather than skip: a green run
  # that tested nothing is the one outcome worse than a red one.
  guard:
    name: Branch check (main only)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run off main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error title=Nightly runs on main only::Dispatched against '${{ github.ref_name }}'. The nightly validates what ships, so re-run it with 'main' selected in the Run workflow dropdown."
            exit 1
          fi
          echo "on main (${{ github.sha }}) - proceeding"

  backend:
    name: Backend (tests, pinned + latest deps)
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Resolve production requirements
        run: pip install --dry-run -r requirements.txt

      - name: Install test dependencies (pinned)
        run: pip install -r requirements-test.txt

      - name: Byte-compile
        run: python -m compileall -q app

      - name: Unit tests (pinned versions)
        run: pytest -q

      # Same suite against the newest releases of every test dependency. A
      # failure here is a warning about what the next pin bump will bring, not
      # a broken commit, so it does not fail the job.
      - name: Unit tests (latest dependencies)
        continue-on-error: true
        run: |
          pip install --upgrade $(grep -oE '^[a-zA-Z0-9_.-]+' requirements-test.txt | tr '\n' ' ')
          pip list --format=freeze | grep -iE 'pydantic|httpx|asyncpg|arq|cryptography|pytest'
          pytest -q

  frontend:
    name: Frontend (build + audit)
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # Advisory: a new CVE in a transitive dep is worth knowing about, but it
      # should not turn the whole nightly red on its own.
      - name: Audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Images build (amd64 + arm64)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Seconds, and it answers the question the 20-minute QEMU build below
      # answers expensively: does every pinned release still exist, on both
      # architectures? It runs first so a yanked or missing asset is reported
      # immediately instead of four minutes into an emulated build - which is
      # exactly how the naabu/arm64 gap stayed hidden.
      - name: Pinned downloads still exist (both architectures)
        run: python3 backend/scripts/check_download_urls.py

      # Emulation, so the arm64 build is exercised on an amd64 runner. Slow,
      # which is why this lives in the nightly and not on every push.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Two things break on Apple Silicon and nowhere else: a tool release with
      # no arm64 archive, and a Python pin with no aarch64 wheel (which then
      # tries to compile in a slim image with no toolchain). Building both
      # architectures is the only way to notice before a user does.
      - name: Build backend image (both architectures)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --target app -t syphax-backend:nightly ./backend

      # Separate dependency set (mitmproxy pins cryptography<44.1), so it can
      # break on its own and must be built on its own.
      - name: Build proxy image (both architectures)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --target proxy -t syphax-proxy:nightly ./backend

      - name: Build sandbox runner (both architectures)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t syphax-sandbox-runner:nightly ./sandbox-runner

      - name: Build frontend image (both architectures)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t syphax-frontend:nightly ./frontend

      - name: Compose config is valid
        run: docker compose config --quiet

      # Guards the Windows failure mode: a CRLF shebang on a file used as
      # ENTRYPOINT makes Docker report "no such file or directory" for a file
      # that plainly exists. .gitattributes pins these to LF; this checks it held.
      - name: Container scripts are LF-only
        run: |
          fail=0
          for f in backend/entrypoint.sh sandbox-runner/entrypoint.sh; do
            if grep -qU $'\r' "$f"; then echo "CRLF found in $f"; fail=1; fi
          done
          exit $fail

  smoke:
    name: Stack boots and the gate holds
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Everything else in this workflow proves the pieces are individually
      # sound. This one proves they add up to a running install - which is what
      # an operator on a fresh VM actually finds out, and the one thing no unit
      # test can tell us. amd64 only: this is about wiring, and the
      # architecture question is answered by the `docker` job above.
      - name: Prepare a fresh install, the way an operator would
        run: |
          ./install.sh --yes --skip-build
          # The generated password has to survive into the containers, so the
          # only thing this proves is that install.sh wrote a usable .env.
          grep -q '^POSTGRES_PASSWORD=.\{16,\}' .env
          grep -q '^SYPHAX_SECRET_KEY=.\{16,\}' .env

      - name: Build the API image (amd64)
        run: docker compose build backend

      - name: Start postgres, redis and the API
        run: |
          docker compose up -d postgres redis backend
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the backend never answered /api/health"
          docker compose logs backend
          exit 1

      # The gate, from the outside. Each assertion below is a property the unit
      # tests check in isolation and nothing checks end to end.
      - name: A fresh install exposes nothing but setup
        run: |
          set -eu
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://127.0.0.1:8000/api/engagements)
          test "$code" = "401" || { echo "::error::/api/engagements answered $code, not 401"; cat /tmp/body; exit 1; }
          grep -q '"setup_required":true' /tmp/body || { echo "::error::401 did not say setup is required"; cat /tmp/body; exit 1; }

          # The login page has to be able to load, or there is no way in.
          curl -fsS http://127.0.0.1:8000/api/auth/status | grep -q '"setup_required":true'

      - name: Setup creates the account, and then closes
        run: |
          set -eu
          curl -fsS -c /tmp/jar -X POST http://127.0.0.1:8000/api/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-operator","password":"a long enough passphrase"}' \
            | grep -q '"username":"ci-operator"'

          # A second call must be refused. An open setup route is a backdoor.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"attacker","password":"a long enough passphrase"}')
          test "$code" = "409" || { echo "::error::setup reopened, answering $code"; exit 1; }

      - name: The session works, and a wrong password does not
        run: |
          set -eu
          # The cookie from setup is a working session.
          curl -fsS -b /tmp/jar http://127.0.0.1:8000/api/engagements >/dev/null

          # Without it, still 401 - but no longer "setup required".
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://127.0.0.1:8000/api/engagements)
          test "$code" = "401"
          grep -q '"setup_required":false' /tmp/body

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-operator","password":"the wrong passphrase"}')
          test "$code" = "401" || { echo "::error::a wrong password answered $code"; exit 1; }

          curl -fsS -c /tmp/jar2 -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-operator","password":"a long enough passphrase"}' >/dev/null
          curl -fsS -b /tmp/jar2 http://127.0.0.1:8000/api/auth/me | grep -q '"username":"ci-operator"'

      - name: A run is refused while no model is configured
        run: |
          set -eu
          # example.com is IANA's reserved documentation domain. Nothing is
          # scanned here - the run is refused before it starts, which is the
          # assertion - but the target must still be a real, safe string.
          eng=$(curl -fsS -b /tmp/jar2 -X POST http://127.0.0.1:8000/api/engagements \
            -H 'Content-Type: application/json' \
            -d '{"target_url":"https://example.com","title":"ci smoke","attest_authorized":true}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["engagement"]["id"])')
          code=$(curl -s -o /tmp/body -w '%{http_code}' -b /tmp/jar2 -X POST \
            "http://127.0.0.1:8000/api/engagements/$eng/run")
          test "$code" = "409" || { echo "::error::a run started with no model; answered $code"; cat /tmp/body; exit 1; }
          grep -qi 'settings' /tmp/body || { echo "::error::the refusal does not name the fix"; cat /tmp/body; exit 1; }

      - name: Logout ends the session
        run: |
          set -eu
          curl -fsS -b /tmp/jar2 -c /tmp/jar2 -X POST http://127.0.0.1:8000/api/auth/logout >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar2 http://127.0.0.1:8000/api/auth/me)
          test "$code" = "401" || { echo "::error::the session survived logout, answering $code"; exit 1; }

      - name: Backend logs (always)
        if: always()
        run: docker compose logs --no-color backend | tail -100

      - name: Tear down
        if: always()
        run: docker compose down -v

  ci-env-parity:
    name: CI env parity
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Guard against the failure that broke CI once already: a test importing
      # app.api (FastAPI) passes locally, where the full stack is installed,
      # and fails in CI, which installs only requirements-test.txt. Import
      # every test module with just the CI dependency set - any module that
      # needs more than that is caught here rather than on the next push.
      - name: Install test dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Every test module imports with CI dependencies alone
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys, traceback
          sys.path.insert(0, ".")
          failed = []
          for path in sorted(pathlib.Path("tests").glob("test_*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(module)
              except Exception:
                  failed.append(path.name)
                  print(f"--- {path.name} ---")
                  traceback.print_exc()
          if failed:
              print(f"\n{len(failed)} test module(s) need dependencies CI does not install:")
              for name in failed:
                  print(f"  - {name}")
              print("Either use pytest.importorskip, or test the pure-logic layer instead.")
              sys.exit(1)
          print("all test modules import cleanly")
          PY
