# Lint configuration.
#
# The ruleset is chosen to catch BUGS, not to enforce a house style. Every rule
# enabled below has, at least once, been the difference between a defect that
# shipped and one that did not:
#
#   E9   syntax and IO errors - the file does not even parse
#   F    pyflakes: undefined names, unused imports, f-strings with no
#        placeholders. F821 found `except ScopeError:` in jwt_analysis.py where
#        the name was imported in a *different* function - so an out-of-scope
#        URL raised NameError instead of being skipped, and the whole JWT proof
#        pass died on the first host outside the engagement.
#   W6   deprecated and invalid escape sequences
#   B    flake8-bugbear: mutable default arguments, `raise` inside `except`
#        without `from`, `zip()` without `strict=`. That last one applies to the
#        at-rest cipher, where a keystream shorter than the plaintext would
#        silently truncate rather than fail.
#
# Deliberately NOT enabled:
#   UP   pyupgrade - 1287 findings, all of them `Optional[X]` vs `X | None`.
#        Pure churn across every file, and it would bury the next real finding.
#   I    isort - 44 files reordered for no behavioural gain.
#   S    flake8-bandit - this codebase cracks weak hashes and generates payloads
#        on purpose, so most of its findings here are the tool working. Worth a
#        deliberate pass one day; not worth a blanket rule that gets `# noqa`'d.
line-length = 100
target-version = "py312"

[lint]
select = ["E9", "F", "W6", "B"]

[lint.per-file-ignores]
# These imports exist to register a CREATE TABLE with app.db at import time.
# They are used - by the side effect, which pyflakes cannot see.
"app/main.py" = ["F401"]
